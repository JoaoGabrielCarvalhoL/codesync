spring.config.import=file:./.env[.properties]

spring.datasource.url=${POSTGRES_LOCAL_URL}
spring.datasource.username=${POSTGRES_LOCAL_USERNAME}
spring.datasource.password=${POSTGRES_LOCAL_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASS}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_AUTH_SERVER}
spring.security.oauth2.resourceserver.jwt.audiences=codesync-api

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

brasil-api.url=https://brasilapi.com.br/api

spring.cache.type=caffeine

aws.s3.endpoint-url=${AWS_ENDPOINT}
aws.s3.region=${AWS_REGION}
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.bucket-evidences-name=${EVIDENCES_BUCKET}
aws.s3.bucket-attachments-name=${ATTACHMENTS_BUCKET}
aws.s3.bucket-resources-name=${RESOURCES_BUCKET}

spring.mail.host=${MAILER_HOST}
spring.mail.port=${MAILER_PORT}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
codesync.mail.from=${MAILER_FROM}